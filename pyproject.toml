[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "howo-capture"
version = "0.1.0"
description = "Deterministic capture normalization and product matching for the HOWO Parts Decision Engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
howo-capture = "howo_capture.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
